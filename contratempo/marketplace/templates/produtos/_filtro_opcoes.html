<div class="filter-options">
    {% for o in lista %}
        <label class="check{% if not o.total and not o.marcado %} check--vazio{% endif %}" data-filtro-item="{{ o.rotulo|lower }}">
            <input type="checkbox" name="{{ nome }}" value="{{ o.valor }}"{% if o.marcado %} checked{% endif %}{% if not o.total and not o.marcado %} disabled{% endif %}>
            <span>{{ o.rotulo }} <span class="filtro-total">({{ o.total }}<span class="sr-only"> produto{{ o.total|pluralize }}</span>)</span></span>
        </label>
    {% endfor %}
</div>
