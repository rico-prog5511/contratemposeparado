{% if form.non_field_errors %}
<div class="alert alert-error form-errors-top" role="alert">
    <div class="alert-text">
        {% for erro in form.non_field_errors %}<p>{{ erro }}</p>{% endfor %}
    </div>
</div>
{% elif form.errors %}
<div class="alert alert-error form-errors-top" role="alert">
    <div class="alert-text"><p>Confira os campos destacados abaixo.</p></div>
</div>
{% endif %}
