{% comment %}
Diálogo global de confirmação (usado por main.js).
Qualquer <form data-confirm="Texto"> pede confirmação antes de enviar.
Opcionais: data-confirm-title, data-confirm-ok (rótulo do botão).
Sem JavaScript, o formulário é enviado normalmente.
{% endcomment %}
<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog">
        <div class="confirm-dialog-body">
            <span class="eyebrow">Confirmação</span>
            <h2 id="confirm-dialog-title">Tem certeza?</h2>
            <p id="confirm-dialog-text"></p>
        </div>
        <div class="confirm-dialog-actions">
            <button type="submit" value="cancelar" class="btn btn-ghost">Cancelar</button>
            <button type="submit" value="ok" class="btn btn-accent" id="confirm-dialog-ok">Confirmar</button>
        </div>
    </form>
</dialog>
