<article class="guia-card">
    <span class="guia-card-assunto">{{ artigo.assunto }}</span>
    <h3><a href="{% url 'guia_artigo' artigo.slug %}" class="guia-card-link">{{ artigo.titulo }}</a></h3>
    <p>{{ artigo.resumo }}</p>
    <span class="guia-card-tempo mono">{{ artigo.minutos }} min de leitura</span>
</article>
