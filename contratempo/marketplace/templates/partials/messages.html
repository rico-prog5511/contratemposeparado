{% if messages %}
<ul class="messages" aria-live="polite">
    {% for message in messages %}
        <li class="{{ message.tags }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
            <span class="message-text">{{ message }}</span>
            <button type="button" class="message-close" aria-label="Fechar mensagem">&times;</button>
        </li>
    {% endfor %}
</ul>
{% endif %}
